name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Node.js 24 is required starting June 2, 2026. Set it explicitly now so the
# workflow does not break when GitHub forces the transition on that date.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # enablement: true tells the action to enable Pages via the API when it
      # is not already enabled, rather than just checking and failing.  Without
      # this flag the action makes a GET-only API call; if Pages has never been
      # activated on the repo (or the API returns a non-200 status for any
      # reason) the step fails immediately with "Get Pages site failed".
      - name: Set up Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/index.html

          if [ -d assets ]; then
            cp -r assets _site/assets
          fi

          if [ -d data ]; then
            cp -r data _site/data
          fi

          if [ -f favicon.ico ]; then
            cp favicon.ico _site/favicon.ico
          fi

          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
