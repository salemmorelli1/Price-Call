name: Daily Backfill Realized

on:
  schedule:
    # 16:30 Eastern target with a second DST-covering trigger. The runtime
    # gate rejects any job that arrives before 16:20 Eastern.
    - cron: "30 20 * * 1-5"   # 4:30 PM EDT (summer)
    - cron: "30 21 * * 1-5"   # 4:30 PM EST (winter)
    - cron: "30 23 * * 1-5"   # DST-independent catch-up if an earlier job was delayed
  workflow_dispatch:

# ── Same concurrency group as the production pipeline ────────────────────
# Prevents backfill from running while the production pipeline is active
# and writing to the same artifact files (prediction_log.csv,
# live_attribution_report.json). Both workflows queue rather than cancel.
concurrency:
  group: pricecall-production
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 30
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      PRICECALL_ROOT: ${{ github.workspace }}
      PRICECALL_STRICT_DRIVE_ONLY: "0"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Synchronize source before backfill
        run: |
          git fetch origin "${GITHUB_REF_NAME}" --quiet
          git pull --ff-only origin "${GITHUB_REF_NAME}"
          echo "PRICECALL_CODE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Restore accumulating artifacts from remote ─────────────────────
      # FIX (Finding C, Audit 2026-04-21): same fix as tuesday-pipeline.yml.
      # Fetch the current prediction_log from origin before backfill runs so
      # realized prices are appended to the full history, not written over it.
      - name: Restore accumulating artifacts from remote
        run: |
          git fetch origin "${GITHUB_REF_NAME}" --quiet
          git checkout "origin/${GITHUB_REF_NAME}" -- \
            artifacts_part3/prediction_log.csv \
            2>/dev/null || echo "prediction_log.csv not on remote yet — starting fresh."
          git checkout "origin/${GITHUB_REF_NAME}" -- \
            artifacts_part9/live_attribution_report.json \
            2>/dev/null || echo "live_attribution_report.json not on remote yet — starting fresh."
          # FIX (BUG-1, Audit 2026-05-11 — Quant-Guild Part 24):
          # tuesday-pipeline.yml received this fix (BUG-4, Part 23) but daily-backfill.yml
          # was not updated in sync. Both workflows share concurrency group pricecall-production
          # and can each check out a stale workspace snapshot. Without restoring these
          # accumulating artifacts here, a backfill run that follows a partial or mis-sequenced
          # Tuesday run can silently overwrite the committed history of these files with an
          # older or empty version, losing Part 8 execution cost history and Part 10 signal
          # history irreversibly.
          #
          # execution_cost_tape.csv: Part 8 reads-then-appends each daily run.
          # signal_log.csv:          Part 10 trading bot accumulates trade signals daily.
          # Both must be restored from origin before any run touches them.
          git checkout "origin/${GITHUB_REF_NAME}" -- \
            artifacts_part8/execution_cost_tape.csv \
            2>/dev/null || echo "execution_cost_tape.csv not on remote yet — starting fresh."
          git checkout "origin/${GITHUB_REF_NAME}" -- \
            artifacts_part10_bot/signal_log.csv \
            2>/dev/null || echo "signal_log.csv not on remote yet — starting fresh."
          # FIX (F-5, Quant-Guild Part 32 Audit):
          # v1_final_production_governance.csv is a daily-accumulating artifact:
          # Part 3 appends one row per run with dedup-on-Date logic at L1659.
          # Without restoring from origin first, every run starts with an empty
          # or missing file and the governance history collapses to 1 row.
          # This restore is the same pattern as prediction_log.csv (already fixed
          # in Audit 2026-04-21). The governance CSV was inadvertently omitted.
          git checkout "origin/${GITHUB_REF_NAME}" -- \
            artifacts_part3_v1/v1_final_production_governance.csv \
            2>/dev/null || echo "v1_final_production_governance.csv not on remote yet — starting fresh."

      - name: Check for a completed market session
        id: gate
        run: |
          python - <<'PYEOF'
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/New_York"))
          manual = os.environ.get("GITHUB_EVENT_NAME", "") == "workflow_dispatch"
          settled = now.weekday() < 5 and (now.hour > 16 or (now.hour == 16 and now.minute >= 20))
          if manual and not settled:
              raise SystemExit("Manual backfill refused: the current market session is not settled (requires weekday at/after 16:20 ET).")
          marker = Path("artifacts_part9/backfill_run_date.txt")
          completed = marker.read_text(encoding="utf-8").strip() if marker.exists() else ""
          should_run = settled and completed != now.date().isoformat()
          status = "RUN" if should_run else ("ALREADY_COMPLETE" if completed == now.date().isoformat() else "PRE_CLOSE")
          print(f"NY time={now.isoformat()} settled={settled} manual={manual} completed={completed or 'none'} status={status}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"run={'true' if should_run else 'false'}\n")
              f.write(f"status={status}\n")
          PYEOF

      - name: Run backfill
        if: steps.gate.outputs.run == 'true'
        run: python backfill_realized.py

      - name: Record successful backfill date
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PYEOF'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          marker = Path("artifacts_part9/backfill_run_date.txt")
          marker.parent.mkdir(parents=True, exist_ok=True)
          marker.write_text(datetime.now(ZoneInfo("America/New_York")).date().isoformat() + "\n", encoding="utf-8")
          PYEOF

      - name: Synchronize dashboard and verify published artifacts
        if: steps.gate.outputs.run == 'true'
        run: |
          python sync_dashboard.py --root .
          python artifact_integrity.py --root .

      - name: Commit and push backfill artifacts
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # FIX (F1, Quant-Guild S55 Audit): add artifacts_part3_v1/part3_summary.json
          # to this git add block.
          #
          # ROOT CAUSE OF live_realized_dates=0 PERSISTING SIX CONSECUTIVE SESSIONS:
          # The S54 F1 fix in backfill_realized.py correctly patches part3_summary.json
          # on the runner after writing the amended prediction_log.csv. However this
          # commit step only staged artifacts_part3/prediction_log.csv and
          # artifacts_part9/live_attribution_report.json. The patched summary existed
          # on the runner filesystem but was NEVER COMMITTED TO ORIGIN. Every subsequent
          # pipeline run's restore step fetched the stale (live_realized_dates=0) version
          # from origin, and the fix reset silently every session.
          #
          # Adding artifacts_part3_v1/part3_summary.json here closes the chain:
          # backfill_realized.py patches the file → this step stages and commits it →
          # next pipeline restore step fetches the corrected version from origin.
          #
          # Safety properties:
          #   - Idempotent: if the eligible current-protocol count is already exact,
          #     the file is identical to origin and git diff shows no change.
          #   - Failure-safe: if artifacts_part3_v1/part3_summary.json does not exist
          #     on the runner (e.g., Part 3 never ran this cycle), git add -f on a
          #     missing path emits a warning and continues due to the || true guard.
          #   - Scope-limited: backfill_realized.py only patches live_realized_dates,
          #     prediction_log_realized_rows, and prediction_log_realized_pct. No
          #     governance, alpha state, or publish_mode fields are touched.  [FIX F1/S55]
          git add -f \
            artifacts_part3/prediction_log.csv \
            artifacts_part3_v1/part3_summary.json \
            artifacts_part9/live_attribution_report.json \
            artifacts_part9/backfill_run_date.txt \
            artifacts_dashboard/dashboard_snapshot.json \
            artifacts_manifest.json \
            index.html

          if git diff --cached --quiet; then
            echo "No backfill changes to commit."
            exit 0
          fi

          git fetch origin "${GITHUB_REF_NAME}" --quiet
          if [ "$(git rev-parse "origin/${GITHUB_REF_NAME}")" != "${PRICECALL_CODE_SHA}" ]; then
            echo "Remote branch changed during backfill; refusing to merge mixed-run artifacts."
            exit 1
          fi

          git commit -m "Backfill realized prices and refresh dashboard"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Deploy the committed dashboard
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"

      - name: Report backfill gate status
        if: always()
        run: echo "Backfill gate status — ${{ steps.gate.outputs.status || 'FAILED_BEFORE_GATE' }}" >> "$GITHUB_STEP_SUMMARY"
