name: Causal controls

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q .
      # Fatal-name lint is scoped to the new regression suite because the
      # legacy research scripts contain intentionally optional code paths.
      - run: ruff check --select E9,F63,F7,F82 tests/
      - run: pytest -q tests/
