name: Causal controls

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q .
      # The legacy research scripts intentionally contain unresolved optional
      # branches, so fatal-name lint is scoped to the new regression tests.
      - run: ruff check --select E9,F63,F7,F82 tests/
      - name: Import Part 2
        id: import_part2
        continue-on-error: true
        run: python -c "import part2_predictor"
      - name: Test causal base rate
        id: base_rate
        continue-on-error: true
        run: pytest -q tests/test_causal_controls.py::test_causal_base_rate_uses_only_supplied_history
      - name: Test execution lag
        id: execution_lag
        continue-on-error: true
        run: pytest -q tests/test_causal_controls.py::test_execution_weights_are_lagged_one_row
      - name: Test imbalanced classification null
        id: balanced_null
        continue-on-error: true
        run: pytest -q tests/test_causal_controls.py::test_majority_class_forecast_has_balanced_accuracy_half
      - name: Test completed-close selection
        id: completed_close
        continue-on-error: true
        run: pytest -q tests/test_causal_controls.py::test_latest_completed_close_uses_last_available_row
      - name: Test regime causality
        id: regime_causality
        continue-on-error: true
        run: pytest -q tests/test_regime_causality.py
      - name: Require all causal controls
        if: always()
        env:
          RESULTS: >-
            import_part2=${{ steps.import_part2.outcome }}
            base_rate=${{ steps.base_rate.outcome }}
            execution_lag=${{ steps.execution_lag.outcome }}
            balanced_null=${{ steps.balanced_null.outcome }}
            completed_close=${{ steps.completed_close.outcome }}
            regime_causality=${{ steps.regime_causality.outcome }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -q failure; then
            exit 1
          fi
