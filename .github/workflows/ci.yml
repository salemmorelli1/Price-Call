name: Causal controls

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install --no-cache-dir -r requirements-ci-lock.txt
      - run: python -m compileall -q .
      - run: ruff check --select E9,F63,F7,F82 .
      # python -m keeps the repository root on sys.path for the flat-module layout.
      - run: python -m pytest -q tests/
      # A pull request runs on a feature ref; also test the production guard
      # with the same ref name that the merged main workflow receives.
      - run: GITHUB_REF_NAME=main python -m pytest -q tests/
      - run: python artifact_integrity.py --root .
      - run: python prepare_pages.py --root . --site _site
